name: Preserve confirmed PS5 video baseline 1ad4f6c
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/archive-working-video.yml'
      - 'tools/archive-baseline.py'
permissions:
  contents: read
  actions: read
jobs:
  preserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download original installation
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ github.token }}
          run-id: 39876566427
          name: PlexStation-PPSA85301-1ad4f6c4ab562762bd4c2ffa958cc098e234528a
          path: baseline/installation
      - name: Download original matching debug symbols
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ github.token }}
          run-id: 39876566427
          name: PlexStation-native-debug-1ad4f6c4ab562762bd4c2ffa958cc098e234528a
          path: baseline/debug
      - name: Download original diagnostics
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ github.token }}
          run-id: 39876566427
          name: PlexStation-build-diagnostics-1ad4f6c4ab562762bd4c2ffa958cc098e234528a
          path: baseline/diagnostics
      - name: Verify original binary and symbol identities
        run: python3 tools/archive-baseline.py baseline 1ad4f6c4ab562762bd4c2ffa958cc098e234528a 39876566427
      - name: Preserve verified baseline separately
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PlexStation-physical-baseline-1ad4f6c4ab562762bd4c2ffa958cc098e234528a
          path: baseline/
          retention-days: 90
          compression-level: 0
          if-no-files-found: error
