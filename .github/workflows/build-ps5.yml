name: Build PlexStation PS5

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-ps5.yml'
      - 'ci/**'
      - 'ps5/**'
      - 'patches/**'
      - 'src/**'
      - 'host/**'
      - 'tests/**'
      - 'shaders/**'
      - 'assets/**'
      - 'third_party/**'
      - 'tools/check-package.py'
      - 'tools/package-title.py'

permissions:
  contents: read

concurrency:
  group: plexstation-ps5-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    name: Native PS5 title (Arch container)
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      BUILD_JOBS: '2'
    steps:
      - name: Check out PlexStation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Prepare build directories and cache key
        id: key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/logs .ci-cache
          echo "fingerprint=$(python3 ci/fingerprint.py)" >> "$GITHUB_OUTPUT"

      - name: Run host regression suites
        shell: bash
        env:
          VULKAN_HEADERS: /usr/include
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y g++ pkg-config libcurl4-openssl-dev libgnutls28-dev libvulkan-dev
          for suite in build-core test-auth test-home test-audio test-artwork test-controller test-connections test-native-transport test-crash check-native-source test-sanitizers; do
            if ! bash "host/$suite.sh" 2>&1 | tee "artifacts/logs/host-$suite.log"; then
              python3 - "$suite" <<'PYFAIL'
          import pathlib, sys
          suite = sys.argv[1]
          excerpt = '\n'.join(pathlib.Path(f'artifacts/logs/host-{suite}.log').read_text(errors='replace').splitlines()[-40:])
          excerpt = excerpt.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Host regression failed ({suite})::{excerpt}')
          PYFAIL
              exit 1
            fi
          done
          python3 tests/test_symbolization.py | tee artifacts/logs/symbolization-tests.log

      - name: Restore exact native dependency cache
        id: dependencies
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .ci-cache
          key: ps5-native-arch-v1-${{ steps.key.outputs.fingerprint }}-${{ github.run_id }}-${{ github.run_attempt }}
          # Reuse only this exact dependency configuration, including its latest checkpoint.
          restore-keys: ps5-native-arch-v1-${{ steps.key.outputs.fingerprint }}

      - name: Build pinned Arch Linux toolchain image
        shell: bash
        run: |
          set -euo pipefail
          docker build --progress plain -f ci/Dockerfile.ps5 -t plexstation-ps5:locked . \
            2>&1 | tee artifacts/logs/container-build.log

      - name: Compile and validate the real native PS5 title
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --init \
            -e BUILD_JOBS \
            -v "$GITHUB_WORKSPACE:/src" \
            -v "$GITHUB_WORKSPACE/.ci-cache:/build" \
            plexstation-ps5:locked \
            2>&1 | tee artifacts/logs/container-run.log

      - name: Preserve matching native debug files
        shell: bash
        run: python3 ci/collect-debug.py

      - name: Verify installation ZIP executable permissions
        shell: bash
        run: |
          set -euo pipefail
          if python3 tools/package-title.py --verify-only dist/PPSA85301 artifacts/PlexStation-PPSA85301.zip \
              2>&1 | tee artifacts/logs/package-permissions.log; then
            exit 0
          fi
          sudo python3 - <<'PYREPORT'
          import json, pathlib
          path = pathlib.Path('artifacts/validation.json')
          report = json.loads(path.read_text())
          report.update(success=False, last_stage='zip-permissions',
                        reason='Installation ZIP Unix mode validation failed')
          path.write_text(json.dumps(report, indent=2)+'\n')
          PYREPORT
          exit 1

      - name: Ensure diagnostics remain accessible
        if: always()
        shell: bash
        run: |
          sudo chown -R "$(id -u):$(id -g)" artifacts .ci-cache
          if [[ ! -f artifacts/validation.json ]]; then
            python3 - <<'PY'
          import json, pathlib
          pathlib.Path('artifacts/validation.json').write_text(json.dumps({
              'success': False,
              'native_build': 'not completed',
              'reason': 'Container preparation or launch failed; inspect logs',
              'hardware_verification': 'NOT TESTED'
          }, indent=2)+'\n')
          PY
          fi
          cat artifacts/validation.json >> "$GITHUB_STEP_SUMMARY"
          python3 ci/report-result.py

      - name: Preserve native build checkpoints
        if: always() && steps.dependencies.outcome == 'success' && steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .ci-cache
          key: ps5-native-arch-v1-${{ steps.key.outputs.fingerprint }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload complete installation folder ZIP
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PlexStation-PPSA85301-${{ github.sha }}
          path: |
            artifacts/PlexStation-PPSA85301.zip
            artifacts/SHA256SUMS
            artifacts/validation.json
            artifacts/packages.txt
            artifacts/source-SHA256SUMS.txt
            artifacts/radv-provenance.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload matching native debug artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PlexStation-native-debug-${{ github.sha }}
          path: artifacts/debug/
          if-no-files-found: error
          retention-days: 30

      - name: Upload logs and validation report (including failed builds)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PlexStation-build-diagnostics-${{ github.sha }}
          path: |
            artifacts/logs/
            artifacts/validation.json
            artifacts/packages.txt
            artifacts/source-SHA256SUMS.txt
            artifacts/radv-provenance.txt
          if-no-files-found: error
          retention-days: 14
